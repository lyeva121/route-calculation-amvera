<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Расчёт маршрута</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <div class="developer">Разработчик Лёвочкин Виктор</div>
    <h1>Расчёт маршрута</h1>

    <section class="top-panel">
      <label class="speed-box"><span>Скорость (км/ч)</span><input id="speed" inputmode="decimal" autocomplete="off"></label>
      <label class="check"><input type="checkbox" id="sameWind"> <span>Ветер по всему маршруту одинаковый</span></label>
      <div class="history"><span>История</span><button id="undo" type="button">←</button><button id="redo" type="button">→</button></div>
    </section>

    <section id="warning" class="reverse-warning hidden"><strong>Проверьте соответствие данных в примечании</strong><button type="button" id="closeWarning">ОК</button></section>

    <section class="table-wrap" aria-label="Таблица маршрута">
      <table id="routeTable">
        <colgroup><col style="width:180px"><col style="width:65px"><col style="width:90px"><col style="width:75px"><col style="width:90px"><col style="width:65px"><col style="width:130px"><col></colgroup><thead>
          <tr><th rowspan="2">ППМ</th><th rowspan="2">ЗМПУ</th><th rowspan="2">Расстояние</th><th colspan="2">Ветер метео</th><th rowspan="2">МК</th><th rowspan="2">Время</th><th rowspan="2">Примечание</th></tr>
          <tr><th>Напр. (°)</th><th>Скор. (км/ч)</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>

    <section class="buttons">
      <button id="addRow" type="button">Добавить ППМ</button>
      <button id="reverse" type="button">Реверс</button>
      <button id="removeWind" type="button">Убрать ветер</button>
      <button id="newRoute" type="button">Новый маршрут</button>
      <button id="saveRoute" type="button">Сохранить</button>
      <label class="file-button">Открыть<input id="openRoute" type="file" accept="application/json,.json"></label>
      <button id="pdf" type="button">PDF</button>
      <button id="help" type="button">Помощь</button>
    </section>

    <button id="calculate" class="calculate" type="button">РАСЧЁТ</button>
    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <dialog id="helpDialog"><div class="dialog-head"><h2>Помощь</h2><button id="closeHelp" type="button">×</button></div><div class="help-text" id="helpText"></div></dialog>
  <script src="/vendor/pdfmake.min.js"></script>
  <script src="/vendor/vfs_fonts.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
